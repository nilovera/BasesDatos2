name: fixture2030

services:
  mongo:
    image: mongo:8.0
    container_name: fixture2030-mongo
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --oplogSize
      - "128"
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - fixture2030_mongo_data:/data/db
      - ./mongodb/init:/opt/fixture2030/init:ro
    networks:
      - fixture2030
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host localhost:27017
          --eval "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      CATALOG_ROOT: /opt/fixture2030/catalogo
    volumes:
      - ./mongodb/init:/opt/fixture2030/init:ro
      - ./data/catalogo:/opt/fixture2030/catalogo:ro
    networks:
      - fixture2030
    entrypoint: ["/bin/bash", "-lc"]
    # La lista conserva todo el bloque como un único argumento para `bash -lc`.
    # Un escalar aquí puede ser dividido por Compose y dejar a mongosh sin URI.
    command:
      - |
        mongosh --quiet 'mongodb://mongo:27017/?directConnection=true' /opt/fixture2030/init/00_replica_init.js &&
        mongosh --quiet 'mongodb://mongo:27017/?replicaSet=rs0' /opt/fixture2030/init/01_schema.js &&
        mongosh --quiet 'mongodb://mongo:27017/?replicaSet=rs0' /opt/fixture2030/init/02_seed_catalogo.js &&
        mongosh --quiet 'mongodb://mongo:27017/?replicaSet=rs0' /opt/fixture2030/init/03_verify.js
    restart: "no"

  redis:
    image: redis:7.4.2-alpine
    container_name: fixture2030-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - fixture2030_redis_data:/data
    networks:
      - fixture2030
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: fixture2030-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "127.0.0.1:9121:9121"
    networks:
      - fixture2030
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  cassandra:
    image: cassandra:5.0.9
    container_name: fixture2030-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: Fixture2030Local
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - fixture2030_cassandra_data:/var/lib/cassandra
      - ./cassandra/init:/opt/fixture2030/init:ro
    networks:
      - fixture2030
    healthcheck:
      test: ["CMD-SHELL", "cqlsh localhost 9042 -e 'SELECT release_version FROM system.local' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  cassandra-init:
    image: cassandra:5.0.9
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra/init:/opt/fixture2030/init:ro
    networks:
      - fixture2030
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        /opt/cassandra/bin/cqlsh cassandra 9042 -f /opt/fixture2030/init/01_schema.cql &&
        /opt/cassandra/bin/cqlsh cassandra 9042 -f /opt/fixture2030/init/02_verify.cql
    restart: "no"

  influxdb-permissions:
    image: influxdb:3.12.3-core
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /var/lib/influxdb3/data
        chown -R influxdb3:influxdb3 /var/lib/influxdb3/data
    volumes:
      - fixture2030_influxdb_data:/var/lib/influxdb3/data
    network_mode: "none"
    restart: "no"

  influxdb:
    image: influxdb:3.12.3-core
    container_name: fixture2030-influxdb
    depends_on:
      influxdb-permissions:
        condition: service_completed_successfully
    command:
      - influxdb3
      - serve
      - --node-id=fixture2030-local
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --http-bind=0.0.0.0:8181
      - --admin-token-file=/run/secrets/influxdb-admin-token
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - fixture2030_influxdb_data:/var/lib/influxdb3/data
    secrets:
      - influxdb-admin-token
      - influxdb-admin-token-raw
    networks:
      - fixture2030
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          influxdb3 show databases --host http://localhost:8181
          --token "$$(cat /run/secrets/influxdb-admin-token-raw)"
          --format json >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  influxdb-init:
    image: influxdb:3.12.3-core
    depends_on:
      influxdb:
        condition: service_healthy
    secrets:
      - influxdb-admin-token-raw
    networks:
      - fixture2030
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -eu
        TOKEN="$$(cat /run/secrets/influxdb-admin-token-raw)"
        HOST="http://influxdb:8181"

        ensure_database() {
          database_name="$$1"
          database_retention="$$2"
          if ! influxdb3 show databases --host "$$HOST" --token "$$TOKEN" --format json | grep -Fq "$$database_name"; then
            influxdb3 create database --host "$$HOST" --token "$$TOKEN" --retention-period "$$database_retention" "$$database_name"
          fi
        }

        ensure_table() {
          table_database="$$1"
          table_name="$$2"
          table_tags="$$3"
          table_fields="$$4"
          if ! influxdb3 query --host "$$HOST" --token "$$TOKEN" --database "$$table_database" --format json "SHOW TABLES" | grep -Fq "$$table_name"; then
            influxdb3 create table --host "$$HOST" --token "$$TOKEN" --database "$$table_database" --tags "$$table_tags" --fields "$$table_fields" "$$table_name"
          fi
        }

        ensure_database fixture2030-detalle 7d
        ensure_database fixture2030-historico 365d
        ensure_table fixture2030-detalle posiciones_jugador "partido_id,equipo_id,jugador_id" "x:float64,y:float64,periodo:int64,segundo_partido:int64"
        ensure_table fixture2030-detalle estadisticas_equipo "partido_id,equipo_id" "posesion_pct:float64,pases_intervalo:int64,tiros_acumulados:int64,goles_acumulados:int64,periodo:int64,segundo_partido:int64"
        ensure_table fixture2030-historico resumen_equipo_15m "partido_id,equipo_id" "posesion_promedio:float64,pases_total:int64,tiros_finales:int64,goles_finales:int64,muestras:int64"
        echo "InfluxDB inicializado: detalle=7d, historico=365d."
    restart: "no"

  neo4j:
    image: neo4j:5.26.34-community-trixie
    container_name: fixture2030-neo4j
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j-auth
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    secrets:
      - neo4j-auth
      - neo4j-password
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - fixture2030_neo4j_data:/data
      - fixture2030_neo4j_logs:/logs
      - fixture2030_neo4j_import:/var/lib/neo4j/import
    networks:
      - fixture2030
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -a bolt://localhost:7687 -u neo4j
          -p "$$(cat /run/secrets/neo4j-password)"
          "RETURN 1" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  neo4j-init:
    image: fixture2030-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD_FILE: /run/secrets/neo4j-password
      NEO4J_DATABASE: neo4j
      CATALOG_ROOT: /opt/fixture2030/catalogo
    secrets:
      - neo4j-password
    volumes:
      - ./neo4j/init:/opt/fixture2030/neo4j-init:ro
      - ./data/catalogo:/opt/fixture2030/catalogo:ro
    networks:
      - fixture2030
    command: ["python", "/opt/fixture2030/neo4j-init/seed.py", "--seed"]
    restart: "no"

  datamart:
    image: postgres:18.7-alpine3.24
    container_name: fixture2030-datamart
    environment:
      POSTGRES_DB: fixture2030_analytics
      POSTGRES_USER: fixture2030
      POSTGRES_PASSWORD_FILE: /run/secrets/datamart-password
    secrets:
      - datamart-password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - fixture2030_datamart_data:/var/lib/postgresql
      - ./datamart/init:/docker-entrypoint-initdb.d:ro
    networks:
      - fixture2030
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixture2030 -d fixture2030_analytics"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  api:
    image: fixture2030-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fixture2030-api
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DATABASE: fixture2030
      MONGODB_TIMEOUT_MS: "3000"
      REDIS_URL: redis://redis:6379/0
      REDIS_TIMEOUT_SECONDS: "1.0"
      MATCH_CACHE_TTL_SECONDS: "60"
      SESSION_DEFAULT_TTL_SECONDS: "1800"
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: fixture2030_comments
      CASSANDRA_TIMEOUT_SECONDS: "3.0"
      INFLUXDB_URL: http://influxdb:8181
      INFLUXDB_TOKEN_FILE: /run/secrets/influxdb-admin-token-raw
      INFLUXDB_DETAIL_DATABASE: fixture2030-detalle
      INFLUXDB_HISTORICAL_DATABASE: fixture2030-historico
      INFLUXDB_TIMEOUT_SECONDS: "3.0"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD_FILE: /run/secrets/neo4j-password
      NEO4J_DATABASE: neo4j
      NEO4J_TIMEOUT_SECONDS: "3.0"
      DATAMART_HOST: datamart
      DATAMART_PORT: "5432"
      DATAMART_DATABASE: fixture2030_analytics
      DATAMART_USER: fixture2030
      DATAMART_PASSWORD_FILE: /run/secrets/datamart-password
      DATAMART_TIMEOUT_SECONDS: "3"
      DATAMART_POOL_MIN_SIZE: "2"
      DATAMART_POOL_MAX_SIZE: "10"
      DATAMART_POOL_TIMEOUT_SECONDS: "3.0"
      DATAMART_POOL_MAX_IDLE_SECONDS: "300.0"
    secrets:
      - influxdb-admin-token-raw
      - neo4j-password
      - datamart-password
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - fixture2030
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      influxdb-init:
        condition: service_completed_successfully
      neo4j-init:
        condition: service_completed_successfully
      datamart:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: fixture2030-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - fixture2030_prometheus_data:/prometheus
    secrets:
      - influxdb-admin-token-raw
    networks:
      - fixture2030
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    container_name: fixture2030-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-fixture2030}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - fixture2030_grafana_data:/var/lib/grafana
    networks:
      - fixture2030
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

networks:
  fixture2030:
    name: fixture2030-network

volumes:
  fixture2030_mongo_data:
    name: fixture2030-mongo-data
  fixture2030_prometheus_data:
    name: fixture2030-prometheus-data
  fixture2030_grafana_data:
    name: fixture2030-grafana-data
  fixture2030_redis_data:
    name: fixture2030-redis-data
  fixture2030_cassandra_data:
    name: fixture2030-cassandra-data
  fixture2030_influxdb_data:
    name: fixture2030-influxdb-data
  fixture2030_neo4j_data:
    name: fixture2030-neo4j-data
  fixture2030_neo4j_logs:
    name: fixture2030-neo4j-logs
  fixture2030_neo4j_import:
    name: fixture2030-neo4j-import
  fixture2030_datamart_data:
    name: fixture2030-datamart-data

secrets:
  influxdb-admin-token:
    file: ./.secretos/influxdb-admin-token.json
  influxdb-admin-token-raw:
    file: ./.secretos/influxdb-admin-token.txt
  neo4j-auth:
    file: ./.secretos/neo4j-auth.txt
  neo4j-password:
    file: ./.secretos/neo4j-password.txt
  datamart-password:
    file: ./.secretos/datamart-password.txt
