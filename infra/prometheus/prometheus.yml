global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: fixture2030-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: fixture2030-outbox
    metrics_path: /metrics
    static_configs:
      - targets: ["outbox-worker:9101"]

  - job_name: fixture2030-redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: fixture2030-influxdb
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/influxdb-admin-token-raw
    static_configs:
      - targets: ["influxdb:8181"]
