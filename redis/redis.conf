bind 0.0.0.0
# La API y el exporter acceden desde la red Docker. El puerto del host se
# publica exclusivamente en 127.0.0.1; este entorno no es productivo.
protected-mode no
port 6379
timeout 0
tcp-keepalive 300

# La instancia contiene datos derivados o temporales; MongoDB sigue siendo
# la fuente oficial. LFU conserva las claves mas consultadas bajo presion.
maxmemory 256mb
maxmemory-policy allkeys-lfu
maxmemory-samples 10

# Persistencia combinada para comparar ambos mecanismos de la clase.
save 60 1
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes

dir /data
loglevel notice
